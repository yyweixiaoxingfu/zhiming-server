<div class="form-group col-lg-{$_layout[$name]['lg']|default='12'}
    col-md-{$_layout[$name]['md']|default='12'}
    col-sm-{$_layout[$name]['sm']|default='12'}
    col-xs-{$_layout[$name]['xs']|default='12'}
    js-amap
    {$extra_class|default=''}"
     data-level="{$level == '' ? 12 : $level}"
     id="form_group_{$name}">
    <label class="col-xs-12" for="{$name}">{$title|htmlspecialchars}</label>
    <div class="col-xs-12">
        <input class="form-control amap-address" id="amap-address-{$name}" name="{$name}_address" type="text" value="{$address|default=''}" placeholder="请输入要搜索的地址">
        {notempty name="$tips"}
        <div class="help-block">{$tips|clear_js}</div>
        {/notempty}
        <div class="searchResultPanel"></div>
        <input class="form-control amap-point" type="hidden" id="{$name}" name="{$name}" value="{$value|default=''}">
        <div class="amap push-10-t" id="amap-canvas-{$name}"></div>
    </div>
</div>

<script type="text/javascript">
    window._AMapSecurityConfig = {
        securityJsCode:"{$secret|default=''}",
    }
</script>
<script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key={$ak|default=''}"></script>

<style>
    .amap{
        width:100%;
        height:500px;
        border: 1px solid #ccc;
    }
    .searchResultPanel{
        border:1px solid #C0C0C0;
        width:150px;
        height:auto;
        display:none;
    }
    .amap-icon img,
    .amap-marker-content img{
        width: 25px;
        height: 34px;
    }
</style>
