<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录成功</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .success-container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            padding: 48px 32px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #4cd964 0%, #2dd4bf 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
        }
        h1 {
            color: #1d2129;
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .success-desc {
            color: #4e5969;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background-color: #07c160;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #05a850;
        }
        .auto-close {
            margin-top: 20px;
            color: #86909c;
            font-size: 14px;
        }
        .wechat-tip {
            margin-top: 15px;
            color: #ff7d00;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">✓</div>
        <h1>微信扫码登录成功！</h1>
        <p class="success-desc">
            您已成功通过微信验证<br>
            点击下方按钮关闭当前页面
        </p>
        <!-- 微信兼容版关闭按钮 -->
        <a href="javascript:closeWechatPage();" class="btn">关闭当前页面</a>
        <p class="auto-close">将在 <span id="countdown">5</span> 秒后自动关闭...</p>
        <p class="wechat-tip">若无法关闭，可点击微信右上角「...」选择「关闭页面」</p>
    </div>

    <script>
        // 微信环境兼容关闭函数
        function closeWechatPage() {
            try {
                // 方案1：尝试微信内置API（部分微信版本支持）
                if (typeof WeixinJSBridge !== "undefined") {
                    WeixinJSBridge.invoke("closeWindow");
                } else {
                    // 方案2：如果WeixinJSBridge未加载，监听加载完成后执行
                    document.addEventListener("WeixinJSBridgeReady", function() {
                        WeixinJSBridge.invoke("closeWindow");
                    }, false);
                }
                // 方案3：兜底兼容（部分场景生效）
                window.close();
            } catch (e) {
                // 异常处理：提示用户手动关闭
                alert("关闭失败，请点击微信右上角「...」选择「关闭页面」");
            }
        }

        // 自动关闭倒计时（同样使用兼容方案）
        let countdown = 5;
        const countdownEl = document.getElementById("countdown");
        
        const timer = setInterval(() => {
            countdown--;
            countdownEl.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(timer);
                closeWechatPage(); // 调用兼容版关闭函数
            }
        }, 1000);
    </script>
</body>
</html>
